services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - frontend_assets:/srv/frontend:ro
      - email_assets:/srv/email-assets:ro
    depends_on:
      app:
        condition: service_started
      static-assets:
        condition: service_completed_successfully

  # One-off container that copies the frontend build and email brand
  # assets out of the app image into shared volumes on every `up`, so
  # caddy always serves files that match the currently pulled app image
  # (a plain volume mount only auto-populates once, on first creation).
  static-assets:
    image: josiahsayers15/outpost:latest
    user: root
    entrypoint:
      [
        "sh",
        "-c",
        "rm -rf /shared/* && cp -r /usr/src/app/dist/frontend/. /shared/ && rm -rf /email-shared/* && cp -r /usr/src/app/assets/images/. /email-shared/",
      ]
    volumes:
      - frontend_assets:/shared
      - email_assets:/email-shared

  app:
    image: josiahsayers15/outpost:latest
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./container_files/app/db-ip:/usr/src/app/db-ip
    env_file:
      - .env.staging

  jobs:
    image: josiahsayers15/outpost:latest
    restart: unless-stopped
    entrypoint: ["bun", "run", "start:workers"]
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./container_files/app/db-ip:/usr/src/app/db-ip
    env_file:
      - .env.staging

  redis:
    image: redis:8
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    configs:
      - source: redis_conf
        target: /usr/local/etc/redis/redis.conf
    volumes:
      - ./container_files/redis:/data

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - ./container_files/db:/var/lib/postgresql
    env_file:
      - .env.staging

configs:
  redis_conf:
    content: |
      save ""
      appendonly yes
      appendfsync everysec
      loglevel warning

  caddyfile:
    content: |
      # Cloudflare proxies all traffic to this box, so Caddy's own
      # connecting peer is always a Cloudflare edge IP, never the real
      # visitor. Without trusting that peer explicitly, reverse_proxy
      # discards the X-Forwarded-For/CF-Connecting-IP Cloudflare sends and
      # replaces it with its own peer address, so every session recorded
      # the same Cloudflare PoP IP instead of the visitor's. Trusting these
      # ranges (Cloudflare's published edge IPs, see
      # https://www.cloudflare.com/ips/) makes Caddy pass the real client
      # IP through in X-Forwarded-For, which app/server.ts and
      # app/utils/auth.ts already trust for the Caddy->app hop.
      # trusted_proxies_strict rejects any left-most XFF entries beyond
      # the trusted hop, since Cloudflare appends rather than replaces and
      # a client could otherwise inject a spoofed leading entry.
      {
          servers {
              trusted_proxies static \
                  173.245.48.0/20 \
                  103.21.244.0/22 \
                  103.22.200.0/22 \
                  103.31.4.0/22 \
                  141.101.64.0/18 \
                  108.162.192.0/18 \
                  190.93.240.0/20 \
                  188.114.96.0/20 \
                  197.234.240.0/22 \
                  198.41.128.0/17 \
                  162.158.0.0/15 \
                  104.16.0.0/13 \
                  104.24.0.0/14 \
                  172.64.0.0/13 \
                  131.0.72.0/22 \
                  2400:cb00::/32 \
                  2606:4700::/32 \
                  2803:f800::/32 \
                  2405:b500::/32 \
                  2405:8100::/32 \
                  2a06:98c0::/29 \
                  2c0f:f248::/32
              trusted_proxies_strict
          }
      }

      outpost.sayerscloud.com {
          handle /api/* {
              reverse_proxy app:3000
          }

          handle /health {
              reverse_proxy app:3000
          }

          handle /ready {
              reverse_proxy app:3000
          }

          handle /admin/* {
            reverse_proxy app:3000
          }

          handle /email-assets/* {
              uri strip_prefix /email-assets
              root * /srv/email-assets
              file_server
          }

          handle {
              # WebKit/Safari requires Access-Control-Allow-Origin on a
              # <script crossorigin> response to report real file/line/column
              # details for errors thrown inside it -- even for a same-origin
              # request, unlike Chrome/Firefox which don't need this. Without
              # it, Safari reports every error in this bundle as an opaque
              # webkit-masked-url://hidden/ frame, source maps notwithstanding.
              header Access-Control-Allow-Origin "*"
              root * /srv/frontend
              encode gzip
              try_files {path} /index.html
              file_server
          }
      }

volumes:
  caddy_data:
  caddy_config:
  frontend_assets:
  email_assets:
