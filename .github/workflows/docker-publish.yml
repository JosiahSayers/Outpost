name: Docker Publish
on:
  push:
    branches:
      - main
jobs:
  publish:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone -- the Dockerfile's
          # sourcemaps stage runs `sentry-cli releases set-commits --auto`,
          # which walks git log between the previous release and this
          # commit and has nothing to walk otherwise.
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "value=$(cat version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            josiahsayers15/outpost:latest
            josiahsayers15/outpost:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
