name: Deploy Staging
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Configure SSH host
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host outpost-staging
            HostName ${{ secrets.STAGING_SSH_HOST }}
            User ${{ secrets.STAGING_SSH_USER }}
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Pull latest images
        run: ssh outpost-staging 'docker compose pull'

      - name: Start new images
        run: ssh outpost-staging 'docker compose up -d'

      - name: Prune dangling images
        if: always()
        run: ssh outpost-staging 'docker image prune -f'
