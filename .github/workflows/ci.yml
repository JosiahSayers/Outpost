name: CI
on:
  pull_request:
jobs:
  run_checks:
    name: Run Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [test:unit, test:integration, format:check, typecheck]
    services:
      db:
        image: postgres
        env:
          POSTGRES_DB: outpost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outpost
      REDIS_URL: valkey://localhost:6379
      PORT: 3000
      BETTER_AUTH_SECRET: really-bad-secret
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: not-a-real-key
      # Not a secret worth protecting -- a throwaway keypair (bunx --bun
      # web-push generate-vapid-keys) so app/utils/web-push.ts's
      # setVapidDetails() doesn't throw at import time, which it does need a
      # real base64url-encoded, correctly-sized key for (unlike
      # RESEND_API_KEY, web-push validates key format/length up front).
      VAPID_PRIVATE_KEY: aj5xfdpVKs--me0chGMfyHncLP1uNzWjIQUhe9lsow0
      BUN_PUBLIC_VAPID_PUBLIC_KEY: BB4dEQ_hxm7o6RbntaRavaz0wzsLygbcoNH1CsIHcXdybjJlI3ryXyNzpWGwRhM8q9A2hBTJXXEbCRwQP18Db6M
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate prisma client
        run: bunx --bun prisma generate
      - name: Run ${{ matrix.suite }}
        run: bun ${{ matrix.suite }}
