<!doctype html>
<html>
  <head>
    <title>Beef Stew | Mountain House</title>
  </head>
  <body>
    <!-- Mobile tabs render the same panel a second time with "-mobile"
     prefixed classes and (in this fixture only) a decoy calorie figure, to
     prove nutritionText() scopes to the desktop panel rather than picking up
     whichever copy happens to come first. -->
    <div
      class="product-tabs-mobile__panel-text product-tabs-mobile__panel-table product-tabs-mobile__panel-body"
    >
      <p>
        2 servings per container<br />Serving size 1 cups (46g) dry mix<br />(makes
        1 cup prepared)
      </p>
      <table>
        <thead>
          <tr>
            <td>Calories/Per Pouch</td>
            <td>999</td>
          </tr>
        </thead>
      </table>
    </div>

    <div
      class="product-tabs__panel-text product-tabs__panel-table product-tabs__panel-body"
    >
      <p>
        2 servings per container<br />Serving size 1 cups (46g) dry mix<br />(makes
        1 cup prepared)
      </p>
      <table>
        <thead>
          <tr>
            <td>Calories/Per Pouch</td>
            <td>420</td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Total Fat</td>
            <td>16g / 21%</td>
          </tr>
          <tr>
            <td>Protein</td>
            <td>20g / 34%</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
